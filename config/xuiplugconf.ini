[XUIUSAGE]

# 是否启用整个 usage 脚本功能（总开关）
# false = 完全不执行（cron 仍跑，但脚本直接退出）
enabled = true

# 默认 x-ui 数据库路径（不传参数时使用）
# 如果你在 cron 中没有指定路径，就用这里
default_db_path = /etc/x-ui/x-ui.db

# 仅用于说明 cron 频率（脚本本身不读取此值）
# 实际执行频率由系统 cron 控制
cron_interval_minutes = 10


# ====== remark 显示相关 ======

# 当 total != 0（有限流量）时，是否显示剩余流量
# true = 显示 ◔已用◕剩余
# false = 只显示 ◔已用
show_remaining_when_limited = true

# 超过多少 MB 后自动转换为 GB 显示
# 例如 1024 = 1GB
mb_to_gb_threshold = 1024

# 转为 GB 后保留的小数位数
# 例如 2 = 1.25GB
gb_decimal_places = 2


# ====== Telegram 每日汇总 ======

# 是否启用每日 Telegram 汇总发送
# true = 每天定时发送所有 inbound 的 remark 信息
telegram_daily_enable = true

# 每天发送时间（24小时制，格式 HH:MM）
# 注意：脚本每 10 分钟运行一次，只要 >= 这个时间且当天未发送就会发送
telegram_daily_time = 06:00

# 是否从 x-ui 数据库读取 Telegram 配置
# true = 使用 settings 表中的 tgBotToken / tgBotChatId
# false = 使用下面手动填写的 token/chat_id
telegram_use_db_config = true

# 每日汇总消息标题（Telegram 显示）
telegram_summary_title = XUI Inbound Usage Summary


# ====== Telegram 手动覆盖配置（可选） ======

# Telegram Bot Token（为空则使用数据库中的）
telegram_bot_token =

# Telegram Chat ID（为空则使用数据库中的）
telegram_chat_id =

# Telegram API 地址（一般不用改，除非你用反代）
telegram_api_server =

# Telegram 代理（如需走代理访问 Telegram API）
telegram_proxy =


# ====== 状态与锁文件 ======

# 状态文件路径（用于记录“当天是否已发送过 Telegram”）
# 防止 cron 多次触发重复发送
state_file = /var/tmp/xuiplug_show_usage_state.json

# 锁文件路径（用于防止脚本并发执行）
# 推荐配合 cron 的 flock 使用
lock_file = /tmp/xui_usage.lock
